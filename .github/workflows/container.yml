# Unofficial LemonUp container image.
#
# Once a day, this checks for a new LemonUp release in archcorsair/lemonup. If the image
# for that release does not exist yet, it builds LemonUp from the release source with the
# Dockerfile in this branch and pushes the image to ghcr.io under your account.
# You can also run it by hand from the Actions tab, and optionally name an older tag.
name: Container image

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build, such as v2.8.0 (leave blank for the latest release)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Find the release to build
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo archcorsair/lemonup --json tagName --jq .tagName)}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lemonup"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$version"
            # Only the latest release moves the "latest" tag, never an older tag named by hand.
            if [ -z "$INPUT_TAG" ]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: exists
        env:
          IMAGE: ${{ steps.rel.outputs.image }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          # Scheduled runs skip a version that is already published. Manual runs always build.
          if [ "${{ github.event_name }}" = "schedule" ] \
            && docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION already exists, nothing to do."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this branch (Dockerfile)
        if: steps.exists.outputs.done != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: recipe
          persist-credentials: false

      - name: Checkout LemonUp source
        if: steps.exists.outputs.done != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archcorsair/lemonup
          ref: ${{ steps.rel.outputs.tag }}
          path: src
          persist-credentials: false

      - name: Prepare build context
        if: steps.exists.outputs.done != 'true'
        id: prep
        run: |
          cp recipe/Dockerfile recipe/.dockerignore src/
          # Build with the same Rust version the project pins in mise.toml.
          rust="$(sed -n 's/^rust *= *"\(.*\)"/\1/p' src/mise.toml | head -n 1)"
          if [ -z "$rust" ]; then echo "Could not read the Rust version from mise.toml" >&2; exit 1; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.exists.outputs.done != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for smoke test
        if: steps.exists.outputs.done != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          load: true
          push: false
          tags: lemonup:ci
          build-args: RUST_VERSION=${{ steps.prep.outputs.rust }}

      - name: Smoke test image
        if: steps.exists.outputs.done != 'true'
        run: docker run --rm lemonup:ci --version

      - name: Push image
        if: steps.exists.outputs.done != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          push: true
          tags: ${{ steps.rel.outputs.tags }}
          build-args: RUST_VERSION=${{ steps.prep.outputs.rust }}
          labels: |
            org.opencontainers.image.title=lemonup (unofficial container image)
            org.opencontainers.image.source=https://github.com/archcorsair/lemonup
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=MIT
